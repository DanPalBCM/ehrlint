# Install with: uv run pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^\.vscode/
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # Structural guard, not a style check. Real clinical data must never
      # enter this repository; the only committed data files live under
      # examples/, and they are generated by ehrlint.synth.
      - id: no-data-outside-examples
        name: no data files outside examples/
        entry: >-
          bash -c 'stray=$(git diff --cached --name-only --diff-filter=A
          | grep -E "\.(csv|tsv|jsonl|ndjson|parquet|feather|arrow|dta|sav|xpt|xlsx|sas7bdat|db|duckdb|sqlite)$"
          | grep -vE "^examples/" || true);
          if [ -n "$stray" ]; then
            echo "Data files may only be added under examples/:";
            echo "$stray"; exit 1; fi'
        language: system
        pass_filenames: false

      # Every committed dataset must carry the manifest that says it is
      # synthetic. A data directory with no provenance note is exactly what a
      # reviewer of a clinical repository should be suspicious of.
      - id: examples-declare-provenance
        name: every examples/ dataset declares it is synthetic
        entry: >-
          bash -c 'for dir in examples/*/; do
            if [ ! -f "$dir/manifest.json" ]; then
              echo "$dir has no manifest.json saying where its data came from"; exit 1;
            fi;
            if ! grep -q "No real patient record" "$dir/manifest.json"; then
              echo "$dir/manifest.json does not state the data is synthetic"; exit 1;
            fi;
          done'
        language: system
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        files: ^src/
