[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ehrlint"
version = "1.0.0"
description = "Leakage auditor for EHR prediction tasks: lint your clinical prediction task before you train on it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Daniel Palacios", email = "daniel.palacios@bcm.edu" }]
keywords = [
    "ehr",
    "clinical-prediction",
    "data-leakage",
    "omop",
    "meds",
    "machine-learning",
    "reproducibility",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "pydantic>=2.6",
    "pyarrow>=15.0",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[project.optional-dependencies]
meds = ["meds>=0.4,<0.5"]
examples = ["scikit-learn>=1.4"]
all = ["meds>=0.4,<0.5", "scikit-learn>=1.4"]

[project.urls]
Homepage = "https://github.com/DanPalBCM/ehrlint"
Repository = "https://github.com/DanPalBCM/ehrlint"
Issues = "https://github.com/DanPalBCM/ehrlint/issues"

[project.scripts]
ehrlint = "ehrlint.cli:run"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "meds>=0.4,<0.5",
    "scikit-learn>=1.4",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ehrlint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "slow: performance measurements; run with --run-slow",
    "live_download: downloads the MIMIC-IV demo; skipped unless EHRLINT_LIVE_DOWNLOAD is set",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["ehrlint"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.coverage.run]
source = ["ehrlint"]
